name: Playwright Tests in Docker

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Run tests in container and extract report
        run: |
          docker create --name test-container --ipc=host playwright-tests
          docker start -a test-container || true
          docker cp test-container:/app/playwright-report ./playwright-report || true
          docker rm test-container

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30