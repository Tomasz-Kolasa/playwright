name: Playwright Tests in Docker

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Run tests in container and extract report
        env:
          CI_VALID_USERNAME: ${{ secrets.VALID_USER_NAME }}
          CI_VALID_PASSWORD: ${{ secrets.VALID_USER_PASSWORD }}
          ENV: prod
        run: |
          docker create --name test-container --ipc=host \
          -e CI_VALID_USERNAME="$CI_VALID_USERNAME" \
          -e CI_VALID_PASSWORD="$CI_VALID_PASSWORD" \
          -e ENV="$ENV" \
          playwright-tests
          
          docker start -a test-container || EXIT_CODE=$?
          docker cp test-container:/app/playwright-report ./playwright-report || true
          docker rm test-container

          if [ -n "$EXIT_CODE" ]; then
            exit $EXIT_CODE
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30